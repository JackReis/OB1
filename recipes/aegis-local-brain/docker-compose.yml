name: aegis-local-brain

services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openbrain}
      POSTGRES_USER: ${POSTGRES_USER:-openbrain_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      EMBED_DIM: ${EMBED_DIM:-1024}
      POSTGREST_DB_PASSWORD: ${POSTGREST_DB_PASSWORD:?POSTGREST_DB_PASSWORD is required}
    volumes:
      - openbrain-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openbrain_admin} -d ${POSTGRES_DB:-openbrain}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    environment:
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: 3000
      PGRST_DB_URI: postgres://authenticator:${POSTGREST_DB_PASSWORD}@db:5432/${POSTGRES_DB:-openbrain}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PGRST_JWT_ROLE_CLAIM_KEY: .role
    depends_on:
      db:
        condition: service_healthy

  api:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./api:/app
    environment:
      PORT: 8787
      POSTGREST_URL: http://postgrest:3000
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY is required}
      BRAIN_ACCESS_KEY: ${BRAIN_ACCESS_KEY:?BRAIN_ACCESS_KEY is required}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_PATH: ${OLLAMA_EMBED_PATH:-/api/embed}
      EMBED_MODEL: ${EMBED_MODEL:-mxbai-embed-large}
      EMBED_DIM: ${EMBED_DIM:-1024}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      EMBED_VERSION: ${EMBED_VERSION:-ollama:mxbai-embed-large:1024:v1}
      EMBED_NORMALIZE: ${EMBED_NORMALIZE:-0}
      INGEST_V2_ENABLED: ${INGEST_V2_ENABLED:-0}
      RETRIEVAL_V2_MODE: ${RETRIEVAL_V2_MODE:-off}
      INGEST_ALLOWED_SOURCES: ${INGEST_ALLOWED_SOURCES:-*}
      INGEST_RATE_LIMIT_PER_MINUTE: ${INGEST_RATE_LIMIT_PER_MINUTE:-120}
      INGEST_MAX_CHUNKS: ${INGEST_MAX_CHUNKS:-250}
      INGEST_CHUNK_MAX_CHARS: ${INGEST_CHUNK_MAX_CHARS:-4000}
      BRAIN_SERVICE_NAME: aegis-local-brain
      # When "1", /agent-memory-api/writeback ALSO embeds each row into the
      # searchable `thoughts` table (server.mjs:1824) and links it via thought_id.
      # Without it writeback is write-only: rows land in agent_memories, which
      # /functions/v1/search never reads — so curated corrections stayed invisible
      # while raw session_turn records (incl. superseded conclusions) stayed
      # searchable. See bead hermes-hcc9.8. Additive; keeps writeback provenance.
      # NOTE: with this on, writeback now depends on the embedding lane being up
      # (OLLAMA_URL must stay :11435 — :11434 is the wedged GUI-app server).
      AGENT_MEMORY_CAPTURE_THOUGHTS: ${AGENT_MEMORY_CAPTURE_THOUGHTS:-0}
    ports:
      - "${BRAIN_BIND_ADDR:-127.0.0.1}:${BRAIN_API_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgrest
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  openbrain-db:
